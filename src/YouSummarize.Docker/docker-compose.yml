services:
  yousummarize:
    image: ${DOCKER_REGISTRY-}yousummarize
    user: "root"
    container_name: yousummarize.client
    networks:
      - testnet
    restart: always
    ports:
      - "${YOUSUMMARIZE_HTTP_PORT:-8082}:8080"
    build:
      context: ..
      dockerfile: ./YouSummarize/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OPENAI_SECRET=${OPENAI_SECRET}
      - DEEPSEEK_SECRET=${DEEPSEEK_SECRET}
      - EMAIL_BACKUP_FROM=${EMAIL_BACKUP_FROM}
      - EMAIL_BACKUP_DEST=${EMAIL_BACKUP_DEST}
      - DB_HOST_URL=${DB_HOST_URL:-recettesfamille.data}
      - DB_HOST_PORT=${DB_HOST_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-recettesfamilledb}
      - YOUSUMMARIZE_DB_DATABASE=${YOUSUMMARIZE_DB_DATABASE:-}
      - DB_USERNAME=${DB_USERNAME:-pguser}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD requis}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SUPADATA_API_KEY=${SUPADATA_API_KEY}
      - APPROVAL_TOKEN_SECRET=${APPROVAL_TOKEN_SECRET}
      - YTDLP_COOKIES=${YTDLP_COOKIES:-}
    volumes:
      - ${YOUSUMMARIZE_DATA_PATH:-/home/data/yousummarize}:/app/data
networks:
  testnet:
    external: true
        